<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ Abhi Player</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
--glass: rgba(255,255,255,0.05);
--border: rgba(255,255,255,0.15);
--neon1:#00f0ff;
--neon2:#ff00ff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
background:radial-gradient(circle at top,#0a0a0a,#000);
color:white;
overflow-x:hidden;
}

/* NAVBAR */
.navbar{
display:flex;
justify-content:space-between;
padding:15px 25px;
background:var(--glass);
backdrop-filter:blur(30px);
}

.logo{
font-size:22px;
font-weight:600;
background:linear-gradient(45deg,var(--neon1),var(--neon2));
-webkit-background-clip:text;
color:transparent;
}

/* SEARCH */
.search input{
width:320px;
padding:14px 25px;
border-radius:40px;
border:1px solid var(--border);
background:rgba(255,255,255,0.08);
color:white;
outline:none;
font-size:16px;
box-shadow:0 0 10px rgba(0,255,255,0.2);
transition:0.3s;
}
.search input:focus{
box-shadow:0 0 20px var(--neon1),0 0 40px var(--neon2);
transform:scale(1.05);
}

/* PLAYER */
.player-box{padding:20px;text-align:center;}

video{
width:100%;
border-radius:20px;
box-shadow:0 0 25px rgba(0,255,255,0.3);
display:none;
}

audio{
width:100%;
}

/* NOW PLAYING */
.now-playing img{
width:200px;
border-radius:15px;
box-shadow:0 0 30px var(--neon1);
}
.now-playing h2{margin-top:10px;}
.now-playing p{opacity:0.7;}

/* BUTTON */
button{
padding:10px 20px;
border:none;
border-radius:25px;
cursor:pointer;
background:linear-gradient(45deg,var(--neon1),var(--neon2));
margin-top:10px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{
background:linear-gradient(145deg,#111,#1a1a1a);
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:.3s;
}
.card:hover{
transform:scale(1.05);
box-shadow:0 0 20px var(--neon1),0 0 40px var(--neon2);
}

.thumb{position:relative;}
.thumb img{
width:100%;
height:150px;
object-fit:cover;
}
.duration{
position:absolute;
bottom:8px;
right:8px;
background:black;
padding:3px 6px;
font-size:12px;
border-radius:5px;
}

.card-info{padding:10px;}
.card-info p{opacity:0.7;font-size:13px;}

/* MINI PLAYER */
.mini-player{
position:fixed;
bottom:0;
width:100%;
background:rgba(0,0,0,0.7);
display:flex;
align-items:center;
padding:10px;
}
.mini-player img{
width:50px;
border-radius:5px;
}
.mini-player .info{padding-left:10px;}

/* QUALITY */
#quality{
margin-top:10px;
padding:8px;
border-radius:10px;
background:black;
color:white;
display:none;
}

</style>
</head>

<body>

<div class="navbar">
<div class="logo">⚡ Abhishek Music</div>
<div class="search">
<input onkeyup="searchSongs(this.value)" placeholder="Search songs...">
</div>
</div>

<div class="player-box">

<div class="now-playing">
<img id="bigThumb">
<h2 id="bigTitle">No Song</h2>
<p id="bigChannel"></p>
</div>

<video id="video" controls></video>
<audio id="audio" controls autoplay></audio>

<button id="modeBtn" onclick="toggleMode()">🎧 Switch to Video</button>

<select id="quality" onchange="changeQuality()">
<option value="360">360p</option>
<option value="480">480p</option>
<option value="720">720p</option>
<option value="1080">1080p</option>
</select>

</div>

<div class="grid" id="grid"></div>

<div class="mini-player">
<img id="thumb">
<div class="info">
<h4 id="title">No Song</h4>
</div>
</div>

<script>

let mode="audio";
let currentUrl="";
let currentTitle="";
let currentThumb="";

function toggleMode(){
mode = (mode === "audio") ? "video" : "audio";
let btn=document.getElementById("modeBtn");
btn.innerText = mode === "audio" ? "🎧 Switch to Video" : "🎬 Switch to Audio";

if(currentUrl){
play(currentUrl,currentTitle,currentThumb);
}
}

async function play(url,title,thumb){

currentUrl=url;
currentTitle=title;
currentThumb=thumb;

let video=document.getElementById("video");
let audio=document.getElementById("audio");

document.getElementById("title").innerText=title;
document.getElementById("thumb").src=thumb;

document.getElementById("bigThumb").src=thumb;
document.getElementById("bigTitle").innerText=title;

if(mode==="video"){

audio.pause();
audio.style.display="none";

video.style.display="block";

let q=document.getElementById("quality").value;

video.src=`/api/play/video?url=${encodeURIComponent(url)}&quality=${q}`;
video.play();

}else{

video.pause();
video.style.display="none";

audio.style.display="block";

let res=await fetch("/api/play/audio",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({url})
});

let data=await res.json();

audio.src=data.stream;
audio.play();
}

}

function changeQuality(){

let video=document.getElementById("video");
let q=document.getElementById("quality").value;

if(!currentUrl) return;

let currentTime=video.currentTime;
let isPlaying=!video.paused;

video.src=`/api/play/video?url=${encodeURIComponent(currentUrl)}&quality=${q}`;

video.onloadedmetadata=()=>{
video.currentTime=currentTime;
if(isPlaying) video.play();
};

}

let timer;

function searchSongs(q){

clearTimeout(timer);

timer=setTimeout(async()=>{

if(!q) return;

let res = await fetch("/api/search",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({q})
});

let data = await res.json();

let grid=document.getElementById("grid");
grid.innerHTML="";

[...data.main_results,...data.suggested].forEach(v=>{
grid.innerHTML+=`
<div class="card" onclick="play('${v.url}','${v.title}','${v.thumbnail}')">
<div class="thumb">
<img src="${v.thumbnail}">
<span class="duration">${v.duration || "3:20"}</span>
</div>
<div class="card-info">
<h4>${v.title}</h4>
<p>${v.channel || "Unknown"}</p>
</div>
</div>`;
});

},300);
}

/* DEFAULT SONGS */
window.onload=()=>{
let grid=document.getElementById("grid");

let demo=[
{
title:"Sample Song",
url:"https://youtube.com/watch?v=dQw4w9WgXcQ",
thumbnail:"https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg"
}
];

demo.forEach(v=>{
grid.innerHTML+=`
<div class="card" onclick="play('${v.url}','${v.title}','${v.thumbnail}')">
<img src="${v.thumbnail}">
<div style="padding:10px">${v.title}</div>
</div>`;
});
};

/* LANDSCAPE DETECT */
window.addEventListener("resize",()=>{
if(window.innerWidth > window.innerHeight){
document.getElementById("quality").style.display="block";
}else{
document.getElementById("quality").style.display="none";
}
});

</script>

</body>
</html>
