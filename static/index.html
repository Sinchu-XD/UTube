<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Abhi Player</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
background:#000;
color:white;
font-family:Poppins;
margin:0;
}

.navbar{
display:flex;
justify-content:space-between;
padding:15px;
background:#111;
}

.search input{
padding:10px;
border-radius:20px;
border:none;
background:#222;
color:white;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#111;
border-radius:10px;
cursor:pointer;
overflow:hidden;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.card-info{
padding:10px;
}

.player{
position:fixed;
bottom:0;
width:100%;
background:#111;
padding:10px;
display:flex;
align-items:center;
}

.player img{
width:50px;
border-radius:5px;
}

.player .info{
margin-left:10px;
}

audio{
width:100%;
margin-top:5px;
}
</style>
</head>

<body>

<div class="navbar">
<div>⚡ Abhi Music</div>
<div class="search">
<input onkeyup="searchSongs(this.value)" placeholder="Search songs...">
</div>
</div>

<div class="grid" id="grid"></div>

<div class="player">
<img id="thumb">
<div class="info">
<div id="title">No Song</div>
<audio id="audio" controls autoplay></audio>
</div>
</div>

<script>

let timer;

function play(url,title,thumb){
document.getElementById("audio").src = url;
document.getElementById("title").innerText = title;
document.getElementById("thumb").src = thumb;
document.getElementById("audio").play();
}

function searchSongs(q){

clearTimeout(timer);

timer=setTimeout(async()=>{

if(!q) return;

let res = await fetch("/api/search",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({q})
});

let data = await res.json();

let grid=document.getElementById("grid");
grid.innerHTML="";

data.forEach(v=>{
grid.innerHTML+=`
<div class="card" onclick="play('${v.url}','${v.title}','${v.thumbnail}')">
<img src="${v.thumbnail}">
<div class="card-info">
<h4>${v.title}</h4>
<p>${v.channel}</p>
</div>
</div>`;
});

},300);
}

</script>

</body>
</html>
