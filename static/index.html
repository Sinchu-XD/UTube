<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ Neon Ultra Player</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
--glass: rgba(255,255,255,0.05);
--border: rgba(255,255,255,0.15);
--neon1:#00f0ff;
--neon2:#ff00ff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
background:radial-gradient(circle at top,#0a0a0a,#000);
color:white;
overflow-x:hidden;
}

.navbar{
display:flex;
justify-content:space-between;
padding:15px 25px;
background:var(--glass);
backdrop-filter:blur(20px);
}

.logo{
font-size:22px;
font-weight:600;
background:linear-gradient(45deg,var(--neon1),var(--neon2));
-webkit-background-clip:text;
color:transparent;
}

.search input{
padding:10px 20px;
border-radius:30px;
border:1px solid var(--border);
background:var(--glass);
color:white;
outline:none;
}

.player-box{padding:15px;}

video,audio{
width:100%;
border-radius:15px;
background:black;
}

.controls{margin-top:10px;}

.controls button{
padding:8px 15px;
border:none;
border-radius:20px;
margin-right:10px;
cursor:pointer;
background:linear-gradient(45deg,var(--neon1),var(--neon2));
}

select{
padding:8px;
border-radius:10px;
background:black;
color:white;
margin-top:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{
background:var(--glass);
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
}

.thumb img{
width:100%;
height:150px;
object-fit:cover;
}

.card-info{padding:10px;}

.mini-player{
position:fixed;
bottom:0;
width:100%;
background:rgba(0,0,0,0.6);
display:flex;
align-items:center;
padding:10px;
}

.mini-player img{
width:50px;
border-radius:5px;
}
.mini-player .info{padding-left:10px;}
</style>
</head>

<body>

<div class="navbar">
<div class="logo">⚡ Neon Ultra</div>
<div class="search">
<input onkeyup="searchSongs(this.value)" placeholder="Search songs...">
</div>
</div>

<div class="player-box">
<video id="video" controls style="display:none"></video>
<audio id="audio" controls autoplay></audio>

<div class="controls">
<button onclick="mode='audio'">🎧 Audio</button>
<button onclick="mode='video'">🎬 Video</button>
</div>

<select id="quality">
<option value="auto">Auto (1080p)</option>
<option value="360">360p</option>
<option value="480">480p</option>
<option value="720">720p</option>
<option value="1080">1080p</option>
<option value="1440">2K</option>
<option value="2160">4K</option>
</select>

</div>

<div class="grid" id="grid"></div>

<div class="mini-player">
<img id="thumb">
<div class="info">
<h4 id="title">No Song</h4>
</div>
</div>

<script>

let mode="audio";
let timer;

function searchSongs(q){

clearTimeout(timer);

timer=setTimeout(async()=>{

if(!q) return;

let res = await fetch("/api/search",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({q})
});

let data = await res.json();

let grid=document.getElementById("grid");
grid.innerHTML="";

[...data.main_results,...data.suggested].forEach(v=>{
grid.innerHTML+=`
<div class="card" onclick="play('${v.url}','${v.title}','${v.thumbnail}')">
<div class="thumb"><img src="${v.thumbnail}"></div>
<div class="card-info">${v.title}</div>
</div>`;
});

},300);
}

async function play(url,title,thumb){

function changeQuality(){

let video=document.getElementById("video");
let q=document.getElementById("quality").value;

if(!currentUrl) return;

let currentTime = video.currentTime;
let isPlaying = !video.paused;

video.pause();

video.src=`/api/play/video?url=${encodeURIComponent(currentUrl)}&quality=${q}`;

video.onloadedmetadata = () => {

video.currentTime = currentTime;

if(isPlaying){
video.play();
}

};
}
  
currentUrl = url;

let video=document.getElementById("video");
let audio=document.getElementById("audio");
let quality=document.getElementById("quality").value;

document.getElementById("title").innerText=title;
document.getElementById("thumb").src=thumb;

if(mode==="video"){

audio.pause();
audio.style.display="none";

video.style.display="block";

video.src=`/api/play/video?url=${encodeURIComponent(url)}&quality=${quality}`;
video.play();

}else{

video.pause();
video.style.display="none";

audio.style.display="block";

let res=await fetch("/api/play/audio",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({url})
});

let data=await res.json();

audio.src=data.stream;
audio.play();
}

navigator.mediaSession.metadata=new MediaMetadata({
title:title,
artwork:[{src:thumb}]
});
}

</script>

</body>
</html>
