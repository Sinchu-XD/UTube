<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Neon Player</title>

<style>
body{margin:0;background:#000;color:white;font-family:sans-serif;}

.navbar{display:flex;justify-content:space-between;padding:15px;background:#111;}
input{padding:10px;border-radius:20px;border:none;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;padding:15px;}

.card{background:#111;padding:10px;border-radius:10px;cursor:pointer;transition:.3s;}
.card:hover{transform:scale(1.05);box-shadow:0 0 15px cyan;}
.card img{width:100%;border-radius:10px;}

.player-box{padding:10px;}

video,audio{width:100%;border-radius:10px;}

.controls{margin:10px;}
button{padding:8px 15px;margin-right:10px;border:none;border-radius:20px;background:cyan;cursor:pointer;}

.mini{position:fixed;bottom:0;width:100%;background:#111;padding:10px;}
</style>

</head>

<body>

<div class="navbar">
<h2>⚡ Neon Player</h2>
<input onkeyup="searchSongs(this.value)" placeholder="Search...">
</div>

<div class="player-box">
<video id="video" controls style="display:none"></video>
<audio id="audio" controls autoplay></audio>

<div class="controls">
<button onclick="mode='audio'">🎧 Audio</button>
<button onclick="mode='video'">🎬 Video</button>
</div>
</div>

<div class="grid" id="grid"></div>

<div class="mini">
<h4 id="title">No Song</h4>
</div>

<script>

let mode = "audio";

async function searchSongs(q){
if(!q) return;

let res = await fetch("/api/search",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({q})
});

let data = await res.json();

let grid=document.getElementById("grid");
grid.innerHTML="";

[...data.main_results,...data.suggested].forEach(v=>{
grid.innerHTML+=`
<div class="card" onclick="play('${v.url}','${v.title}','${v.thumbnail}')">
<img src="${v.thumbnail}">
<p>${v.title}</p>
</div>`;
});
}

async function play(url,title,thumb){

let endpoint = mode === "video" ? "/api/play/video" : "/api/play/audio";

let res = await fetch(endpoint,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({url})
});

let data = await res.json();

if(!data.stream){
alert("Error");
return;
}

let audio=document.getElementById("audio");
let video=document.getElementById("video");

if(mode==="video"){
audio.pause();
audio.style.display="none";

video.style.display="block";
video.src=data.stream;
video.play();
}else{
video.pause();
video.style.display="none";

audio.style.display="block";
audio.src=data.stream;
audio.play();
}

document.getElementById("title").innerText=title;

/* background support */
navigator.mediaSession.metadata = new MediaMetadata({
title:title,
artwork:[{src:thumb}]
});
}

</script>

</body>
</html>
