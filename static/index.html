<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ Neon Ultra Player</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
--glass: rgba(255,255,255,0.05);
--border: rgba(255,255,255,0.15);
--neon1:#00f0ff;
--neon2:#ff00ff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
background:radial-gradient(circle at top,#0a0a0a,#000);
color:white;
overflow-x:hidden;
}

body::before,body::after{
content:"";
position:fixed;
width:500px;
height:500px;
filter:blur(200px);
z-index:-1;
animation:float 10s infinite alternate;
}
body::before{background:var(--neon1);top:-100px;left:-100px;}
body::after{background:var(--neon2);bottom:-100px;right:-100px;}

@keyframes float{
0%{transform:translate(0,0)}
100%{transform:translate(60px,60px)}
}

.navbar{
display:flex;
justify-content:space-between;
padding:15px 25px;
backdrop-filter:blur(20px);
background:var(--glass);
}

.logo{
font-size:22px;
font-weight:600;
background:linear-gradient(45deg,var(--neon1),var(--neon2));
-webkit-background-clip:text;
color:transparent;
}

.search input{
padding:10px 20px;
border-radius:30px;
border:1px solid var(--border);
background:var(--glass);
color:white;
outline:none;
width:250px;
}

.player-box{padding:15px;}

video,audio{
width:100%;
border-radius:15px;
background:black;
}

.controls{margin-top:10px;}

.controls button{
padding:8px 15px;
border:none;
border-radius:20px;
margin-right:10px;
cursor:pointer;
background:linear-gradient(45deg,var(--neon1),var(--neon2));
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{
position:relative;
background:var(--glass);
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:.3s;
}

.card::before{
content:"";
position:absolute;
inset:-2px;
border-radius:15px;
background:linear-gradient(90deg,var(--neon1),var(--neon2),var(--neon1));
background-size:300%;
animation:neonMove 4s linear infinite;
z-index:-1;
}

@keyframes neonMove{
0%{background-position:0%}
100%{background-position:300%}
}

.card:hover{
transform:translateY(-10px) scale(1.05);
box-shadow:0 0 20px var(--neon1),0 0 40px var(--neon2);
}

.thumb img{
width:100%;
height:150px;
object-fit:cover;
}

.card-info{padding:10px;}

.mini-player{
position:fixed;
bottom:0;
width:100%;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(20px);
display:flex;
align-items:center;
padding:10px;
}

.mini-player img{
width:50px;
border-radius:5px;
}
.mini-player .info{padding-left:10px;}

.loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}

.loader div{
width:50px;
height:50px;
border:4px solid transparent;
border-top:4px solid var(--neon1);
border-right:4px solid var(--neon2);
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div class="loader" id="loader"><div></div></div>

<div class="navbar">
<div class="logo">⚡ Neon Ultra</div>
<div class="search">
<input onkeyup="searchSongs(this.value)" placeholder="Search songs...">
</div>
</div>

<div class="player-box">
<video id="video" controls style="display:none"></video>
<audio id="audio" controls autoplay></audio>

<div class="controls">
<button onclick="mode='audio'">🎧 Audio</button>
<button onclick="mode='video'">🎬 Video</button>
</div>
</div>

<div class="grid" id="grid"></div>

<div class="mini-player">
<img id="thumb">
<div class="info">
<h4 id="title">No Song</h4>
</div>
</div>

<script>

let mode="audio";
let timer;

window.onload=()=>document.getElementById("loader").style.display="none";

function showLoader(){document.getElementById("loader").style.display="flex";}
function hideLoader(){document.getElementById("loader").style.display="none";}

function searchSongs(q){
clearTimeout(timer);

timer=setTimeout(async()=>{
if(!q)return;

showLoader();

try{
let res=await fetch("/api/search",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({q})
});

let data=await res.json();

let grid=document.getElementById("grid");
grid.innerHTML="";

[...data.main_results,...data.suggested].forEach(v=>{
grid.innerHTML+=`
<div class="card" onclick="play('${v.url}','${v.title}','${v.thumbnail}')">
<div class="thumb"><img src="${v.thumbnail}"></div>
<div class="card-info">${v.title}</div>
</div>`;
});

}catch(e){
alert("Search failed");
}

hideLoader();

},300);
}

async function play(url,title,thumb){

let video=document.getElementById("video");
let audio=document.getElementById("audio");

document.getElementById("title").innerText=title;
document.getElementById("thumb").src=thumb;

showLoader();

try{

if(mode==="video"){

audio.pause();
audio.style.display="none";

video.style.display="block";

let res=await fetch(`/api/play/video?url=${encodeURIComponent(url)}`);
let data=await res.json();

if(data.error) throw "video error";

video.src=data.stream;
video.play();

}else{

video.pause();
video.style.display="none";

audio.style.display="block";

let res=await fetch("/api/play/audio",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({url})
});

let data=await res.json();

if(data.error) throw "audio error";

audio.src=data.stream;
audio.play();
}

}catch(e){
alert("Playback failed");
}

hideLoader();

navigator.mediaSession.metadata=new MediaMetadata({
title:title,
artwork:[{src:thumb}]
});
}

</script>

</body>
</html>
