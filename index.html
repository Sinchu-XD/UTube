<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Ultra Pro Player</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    --glass: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.18);
    --neon1: #00f0ff;
    --neon2: #ff00ff;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body {
    background:#000;
    color:white;
    overflow-x:hidden;
}

/* BACKGROUND GLOW */
body::before, body::after {
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    filter:blur(200px);
    z-index:-1;
    animation: float 10s infinite alternate;
}

body::before { background:var(--neon1); top:-100px; left:-100px; }
body::after { background:var(--neon2); bottom:-100px; right:-100px; }

@keyframes float {
    0% { transform:translate(0,0); }
    100% { transform:translate(50px,50px); }
}

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    padding:15px 25px;
    backdrop-filter:blur(25px);
    background:var(--glass);
}

.logo {
    font-size:22px;
    font-weight:600;
    background:linear-gradient(45deg,var(--neon1),var(--neon2));
    -webkit-background-clip:text;
    color:transparent;
}

.search input {
    padding:10px 20px;
    border-radius:30px;
    border:1px solid var(--border);
    background:var(--glass);
    color:white;
}

/* LAYOUT */
.container {
    display:flex;
}

/* SIDEBAR */
.sidebar {
    width:200px;
    padding:20px;
    background:var(--glass);
}

.sidebar a {
    display:block;
    padding:12px;
    margin:10px 0;
    border-radius:12px;
    color:#aaa;
    transition:0.3s;
}

.sidebar a:hover {
    color:white;
    box-shadow:0 0 15px var(--neon1);
}

/* CONTENT */
.content {
    flex:1;
    padding:20px;
}

/* PLAYER */
.player {
    background:var(--glass);
    border-radius:20px;
    padding:10px;
    margin-bottom:20px;
}

iframe {
    width:100%;
    height:360px;
    border-radius:15px;
}

/* GRID (DESKTOP) */
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:20px;
}

/* CARD */
.card {
    position:relative;
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    background:var(--glass);
}

/* NEON BORDER */
.card::before {
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:15px;
    background:linear-gradient(90deg,var(--neon1),var(--neon2),var(--neon1));
    background-size:300%;
    animation:moveBorder 4s linear infinite;
    z-index:-1;
}

@keyframes moveBorder {
    0% { background-position:0%; }
    100% { background-position:300%; }
}

/* HOVER */
.card:hover {
    transform:translateY(-10px) scale(1.05);
    box-shadow:0 0 20px var(--neon1),0 0 40px var(--neon2);
}

/* THUMB */
.thumb {
    height:150px;
    overflow:hidden;
}

.thumb img, .thumb iframe {
    width:100%;
    height:100%;
    object-fit:cover;
}

/* DURATION */
.duration {
    position:absolute;
    bottom:8px;
    right:8px;
    background:black;
    padding:3px 7px;
    font-size:12px;
    border-radius:5px;
}

/* INFO */
.card-info {
    padding:10px;
}

/* MINI PLAYER */
.mini-player {
    position:fixed;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px);
    display:flex;
    align-items:center;
    padding:10px;
}

.mini-player img {
    width:50px;
    border-radius:5px;
}

/* ================= MOBILE PORTRAIT ================= */
@media (max-width: 600px) {

.container {
    flex-direction:column;
}

.sidebar {
    display:flex;
    width:100%;
    justify-content:space-around;
}

.sidebar a {
    margin:5px;
    font-size:12px;
}

iframe {
    height:220px;
}
}

/* ================= LANDSCAPE MODE ================= */
@media (max-width: 900px) and (orientation: landscape) {

.container {
    flex-direction:row;
}

.sidebar {
    width:120px;
    font-size:12px;
}

iframe {
    height:200px;
}

/* 🔥 HORIZONTAL SCROLL */
.grid {
    display:flex;
    overflow-x:auto;
    gap:15px;
    padding-bottom:10px;
}

.grid::-webkit-scrollbar {
    height:5px;
}

.grid::-webkit-scrollbar-thumb {
    background:var(--neon1);
    border-radius:10px;
}

.card {
    min-width:200px;
    flex:0 0 auto;
}
}
</style>

</head>

<body>

<div class="navbar">
<div class="logo">⚡ Neon Ultra Pro</div>

<div class="search">
<input placeholder="Search...">
</div>

<div id="login-box">
<button onclick="fakeLogin()">Login</button>
</div>
</div>

<div class="container">

<div class="sidebar">
<a href="#">🏠 Home</a>
<a href="#">🔥 Trending</a>
<a href="#">🎵 Music</a>
</div>

<div class="content">

<div class="player">
<iframe id="player" src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
</div>

<div class="grid" id="grid"></div>

</div>
</div>

<div class="mini-player">
<img id="thumb">
<div class="info">
<h4 id="title">No Song</h4>
</div>
</div>

<script>

function fakeLogin(){
document.getElementById("login-box").innerHTML =
`<button>🎧 Listen as Abhi</button>`;
}

let videos = 
{id:"kXYiU_JCYtU",title:"Aashiqui Aa Gayi - Radhe Shyam",duration:"4:21"},
{id:"QJO3ROT-A4E",title:"Hue Bechain - Ek Haseena Thi Ek Deewana Tha",duration:"4:10"},
{id:"gvyUuxdRdR4",title:"Pardesia - Mr. Natwarlal",duration:"4:45"},
{id:"lY2yjAdbvdQ",title:"Tum Hi Ho - Aashiqui 2",duration:"4:22"},
{id:"RgKAFK5djSk",title:"Tera Ban Jaunga - Kabir Singh",duration:"3:56"},

];

function render(){
let grid=document.getElementById("grid");
grid.innerHTML="";

videos.forEach((v,i)=>{
grid.innerHTML+=`
<div class="card"
onmouseenter="preview('${v.id}',this)"
onmouseleave="stop('${v.id}',this)"
onclick="play(${i})">

<div class="thumb">
<img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
<span class="duration">${v.duration}</span>
</div>

<div class="card-info">${v.title}</div>
</div>`;
});
}

function preview(id,el){
el.querySelector(".thumb").innerHTML =
`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1"></iframe>`;
}

function stop(id,el){
el.querySelector(".thumb").innerHTML =
`<img src="https://img.youtube.com/vi/${id}/hqdefault.jpg">
<span class="duration">Preview</span>`;
}

function play(i){
document.getElementById("player").src =
"https://www.youtube.com/embed/"+videos[i].id;

document.getElementById("title").innerText=videos[i].title;
document.getElementById("thumb").src =
"https://img.youtube.com/vi/"+videos[i].id+"/0.jpg";
}

render();

</script>

</body>
</html>
