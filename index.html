<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronova Player</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    --glass: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.15);
    --neon1: #00f0ff;
    --neon2: #ff00ff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: radial-gradient(circle at top, #0a0a0a, #000);
    color: white;
}

/* BACKGROUND GLOW */
body::before, body::after {
    content: "";
    position: fixed;
    width: 400px;
    height: 400px;
    filter: blur(180px);
    z-index: -1;
}
body::before {
    background: var(--neon1);
    top: -100px;
    left: -100px;
}
body::after {
    background: var(--neon2);
    bottom: -100px;
    right: -100px;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 25px;
    backdrop-filter: blur(25px);
    background: var(--glass);
}

.logo {
    font-size: 22px;
    font-weight: 600;
    background: linear-gradient(45deg, var(--neon1), var(--neon2));
    -webkit-background-clip: text;
    color: transparent;
}

.search input {
    padding: 10px 20px;
    border-radius: 30px;
    border: 1px solid var(--border);
    background: var(--glass);
    color: white;
}

/* LAYOUT */
.container {
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 200px;
    padding: 20px;
    background: var(--glass);
}

.sidebar a {
    display: block;
    padding: 12px;
    margin: 10px 0;
    border-radius: 12px;
    color: #aaa;
}

.sidebar a:hover {
    color: white;
    box-shadow: 0 0 15px var(--neon1);
}

/* CONTENT */
.content {
    flex: 1;
    padding: 20px;
}

/* PLAYER */
.player {
    background: var(--glass);
    border-radius: 20px;
    padding: 10px;
    margin-bottom: 20px;
}

iframe {
    width: 100%;
    height: 360px;
    border-radius: 15px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
}

/* CARD */
.card {
    position: relative;
    background: var(--glass);
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.3s;
}

/* NEON BORDER */
.card::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 15px;
    background: linear-gradient(45deg, var(--neon1), var(--neon2), var(--neon1));
    z-index: -1;
    animation: glow 3s linear infinite;
}

@keyframes glow {
    0% { filter: blur(5px); opacity: 0.6; }
    50% { filter: blur(15px); opacity: 1; }
    100% { filter: blur(5px); opacity: 0.6; }
}

.card:hover {
    transform: translateY(-10px) scale(1.05);
}

/* THUMB */
.thumb {
    position: relative;
    height: 150px;
}

.thumb img, .thumb iframe {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* DURATION */
.duration {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: black;
    padding: 3px 7px;
    font-size: 12px;
    border-radius: 5px;
}

/* INFO */
.card-info {
    padding: 10px;
    font-size: 14px;
}

/* MINI PLAYER */
.mini-player {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    padding: 10px;
}

.mini-player img {
    width: 50px;
    border-radius: 5px;
}

.mini-player .info {
    flex: 1;
    padding-left: 10px;
}

/* BUTTON */
.listen-btn {
    padding: 8px 15px;
    border-radius: 20px;
    border: none;
    background: linear-gradient(45deg, var(--neon1), var(--neon2));
    color: white;
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">⚡ Neon Ultra Player</div>

    <div class="search">
        <input placeholder="Search...">
    </div>

    <div id="login-box">
        <button class="listen-btn" onclick="fakeLogin()">Login</button>
    </div>
</div>

<div class="container">

    <div class="sidebar">
        <a href="#">🏠 Home</a>
        <a href="#">🔥 Trending</a>
        <a href="#">🎵 Music</a>
    </div>

    <div class="content">

        <div class="player">
            <iframe id="player" src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
        </div>

        <div class="grid" id="grid"></div>

    </div>

</div>

<div class="mini-player">
    <img id="thumb">
    <div class="info">
        <h4 id="title">No Song</h4>
    </div>
</div>

<script>
// FAKE LOGIN
function fakeLogin(){
    document.getElementById("login-box").innerHTML =
    `<button class="listen-btn">🎧 Listen as Abhi</button>`;
}

// DATA
let videos=[
{id:"dQw4w9WgXcQ",title:"Never Gonna Give You Up",duration:"3:33"},
{id:"3JZ_D3ELwOQ",title:"Shape of You",duration:"4:21"},
{id:"kxopViU98Xo",title:"Despacito",duration:"4:42"}
];

// RENDER
function render(){
let grid=document.getElementById("grid");
grid.innerHTML="";

videos.forEach((v,i)=>{
grid.innerHTML+=`
<div class="card"
onmouseenter="startPreview('${v.id}', this.querySelector('.thumb'))"
onmouseleave="stopPreview('${v.id}', this.querySelector('.thumb'))"
onclick="play(${i})">

<div class="thumb">
<img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">
<span class="duration">${v.duration}</span>
</div>

<div class="card-info">${v.title}</div>
</div>`;
});
}

// HOVER PREVIEW
function startPreview(id, el){
el.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0"></iframe>`;
}

function stopPreview(id, el){
el.innerHTML = `<img src="https://img.youtube.com/vi/${id}/hqdefault.jpg">
<span class="duration">Preview</span>`;
}

// PLAY
function play(i){
document.getElementById("player").src=
"https://www.youtube.com/embed/"+videos[i].id;

document.getElementById("title").innerText=videos[i].title;
document.getElementById("thumb").src=
"https://img.youtube.com/vi/"+videos[i].id+"/0.jpg";
}

render();
</script>

</body>
</html>
