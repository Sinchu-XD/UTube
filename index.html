<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Ultra Player</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    --glass: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.15);
    --neon1: #00f0ff;
    --neon2: #ff00ff;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body {
    background: radial-gradient(circle at top, #0a0a0a, #000);
    color: white;
}

/* GLOW BG */
body::before, body::after {
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    filter:blur(180px);
    z-index:-1;
}
body::before { background:var(--neon1); top:-100px; left:-100px; }
body::after { background:var(--neon2); bottom:-100px; right:-100px; }

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    padding:15px 25px;
    backdrop-filter:blur(25px);
    background:var(--glass);
}

.logo {
    font-size:22px;
    font-weight:600;
    background:linear-gradient(45deg,var(--neon1),var(--neon2));
    -webkit-background-clip:text;
    color:transparent;
}

.search input {
    padding:10px 20px;
    border-radius:30px;
    border:1px solid var(--border);
    background:var(--glass);
    color:white;
}

/* LAYOUT */
.container {
    display:flex;
}

/* SIDEBAR */
.sidebar {
    width:200px;
    padding:20px;
    background:var(--glass);
}

.sidebar a {
    display:block;
    padding:12px;
    margin:10px 0;
    border-radius:12px;
    color:#aaa;
}

.sidebar a:hover {
    color:white;
    box-shadow:0 0 15px var(--neon1);
}

/* CONTENT */
.content {
    flex:1;
    padding:20px;
}

/* PLAYER (HIDDEN VIDEO LOOK BUT AUDIO RUNS) */
.player {
    background:var(--glass);
    border-radius:20px;
    padding:10px;
    margin-bottom:20px;
}

audio {
    width:100%;
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:20px;
}

/* CARD */
.card {
    position:relative;
    background:var(--glass);
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}

.card::before {
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:15px;
    background:linear-gradient(45deg,var(--neon1),var(--neon2),var(--neon1));
    z-index:-1;
    animation:glow 3s linear infinite;
}

@keyframes glow {
    0% { filter:blur(5px); opacity:0.6; }
    50% { filter:blur(15px); opacity:1; }
    100% { filter:blur(5px); opacity:0.6; }
}

.card:hover {
    transform:translateY(-10px) scale(1.05);
}

/* THUMB */
.thumb img {
    width:100%;
    height:150px;
    object-fit:cover;
}

/* INFO */
.card-info {
    padding:10px;
}

/* MINI PLAYER */
.mini-player {
    position:fixed;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px);
    display:flex;
    align-items:center;
    padding:10px;
}

.mini-player img {
    width:50px;
    border-radius:5px;
}

.mini-player .info {
    padding-left:10px;
}
</style>

</head>

<body>

<div class="navbar">
<div class="logo">⚡ Neon Player</div>

<div class="search">
<input onkeyup="searchSongs(this.value)" placeholder="Search songs...">
</div>
</div>

<div class="container">

<div class="sidebar">
<a href="#">🏠 Home</a>
<a href="#">🔥 Trending</a>
<a href="#">🎵 Music</a>
</div>

<div class="content">

<div class="player">
<audio id="player" controls autoplay></audio>
</div>

<div class="grid" id="grid"></div>

</div>
</div>

<div class="mini-player">
<img id="thumb">
<div class="info">
<h4 id="title">No Song</h4>
</div>
</div>

<script>

async function searchSongs(q){

if(!q) return;

let res = await fetch(`http://localhost:8000/search?q=${q}`);
let data = await res.json();

let grid = document.getElementById("grid");
grid.innerHTML="";

[...data.main_results, ...data.suggested].forEach(v=>{

grid.innerHTML += `
<div class="card" onclick="play('${v.url}','${v.title}','${v.thumbnail}')">

<div class="thumb">
<img src="${v.thumbnail}">
</div>

<div class="card-info">
${v.title}
</div>

</div>`;
});
}


async function play(url,title,thumb){

let res = await fetch(`http://localhost:8000/stream?url=${encodeURIComponent(url)}`);
let data = await res.json();

if(data.error){
alert("Stream error");
return;
}

let player = document.getElementById("player");

player.src = data.url;
player.play();

document.getElementById("title").innerText = title;
document.getElementById("thumb").src = thumb;

/* 🔥 BACKGROUND CONTROL */
navigator.mediaSession.metadata = new MediaMetadata({
title: title,
artwork: [{ src: thumb }]
});

}

</script>

</body>
</html>
