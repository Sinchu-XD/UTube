<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Music App</title>

<style>
body {
    margin:0;
    background:#000;
    color:white;
    font-family:sans-serif;
}

/* NAV */
.nav {
    padding:15px;
    display:flex;
    justify-content:space-between;
    background:#111;
}

/* SEARCH */
input {
    padding:10px;
    width:200px;
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:15px;
    padding:15px;
}

/* CARD */
.card {
    background:#111;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

.card img {
    width:100%;
    border-radius:10px;
}

/* MINI PLAYER */
.player {
    position:fixed;
    bottom:0;
    width:100%;
    background:#111;
    padding:10px;
}
</style>

</head>

<body>

<div class="nav">
<h2>🔥 My Music</h2>
<input onkeyup="searchSongs(this.value)" placeholder="Search...">
</div>

<div class="grid" id="grid"></div>

<!-- 🎧 BACKGROUND AUDIO -->

<audio id="player" controls autoplay></audio>

<div class="player">
<h4 id="title">No Song</h4>
</div>

<script>

async function searchSongs(q){

if(!q) return;

let res = await fetch(`http://localhost:8000/search?q=${q}`);
let data = await res.json();

let grid = document.getElementById("grid");
grid.innerHTML="";

[...data.main_results, ...data.suggested].forEach(v=>{

grid.innerHTML += `
<div class="card" onclick="play('${v.url}','${v.title}')">

<img src="${v.thumbnail}">
<p>${v.title}</p>

</div>`;
});
}


async function play(url,title){

let res = await fetch(`http://localhost:8000/stream?url=${encodeURIComponent(url)}`);
let data = await res.json();

if(data.error){
alert("Error loading stream");
return;
}

let player = document.getElementById("player");

player.src = data.url;
player.play();

/* 🔥 MEDIA SESSION (LOCK SCREEN SUPPORT) */
navigator.mediaSession.metadata = new MediaMetadata({
title: title
});

document.getElementById("title").innerText = title;

}
</script>

</body>
</html>
